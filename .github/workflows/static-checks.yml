name: Static Skill Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate skill files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run skill validator
        run: python scripts/validate-skills.py

      - name: Run hook validator
        run: python scripts/validate-hooks.py

  validate-plugin-manifest:
    name: Validate plugin manifest (claude plugin validate)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build hermetic plugin-test image
        run: docker build -f Dockerfile.plugin-test .
