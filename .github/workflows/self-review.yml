name: Soundcheck Self-Review

# Runs the Soundcheck security review against this repo on every PR and
# fails the check on any Critical or High finding. This is the "fixit"
# gate: if Soundcheck finds a real bug in its own code, the PR can't
# merge until it's fixed.

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-review:
    name: Run Soundcheck against itself
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # Check out the PR HEAD to the default workspace — this is the review
      # target (untrusted). persist-credentials: false keeps the GITHUB_TOKEN
      # out of .git/config, which the reviewer (Read access) would otherwise
      # be able to read out of the workspace.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Check out the base branch to a sibling directory. Both the reviewer's
      # SKILL.md and the gate *driver* (scripts/) are loaded from here, not
      # from the PR checkout, so a PR that edits either cannot override the
      # reviewer's system prompt or make the driver exit 0.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .soundcheck-trusted-skills
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.319'

      # Make origin/$BASE_REF resolvable in the PR workspace so the diff
      # computes. Without it the diff fails and the gate — now fail-closed —
      # exits 2 instead of silently passing as "no changed files".
      - name: Fetch base ref for the diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Run security review (read-only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Run both the skill and the driver from the trusted base checkout
          # so a PR cannot edit scripts/security-review-action.py to exit 0
          # or print the key. --repo-dir . is still the (untrusted) PR HEAD.
          # Diff-scoped run → the pr-review skill (mode 1: single-pass,
          # Critical/High, no subagents). The full security-review skill
          # expects the Agent tool, which diff mode does not grant.
          TRUSTED="$(pwd)/.soundcheck-trusted-skills"
          python "$TRUSTED/scripts/security-review-action.py" \
            --repo-dir . \
            --skill-path "$TRUSTED/.claude/skills/pr-review/SKILL.md" \
            --diff-base "origin/$BASE_REF" \
            --output-summary /tmp/self-review-summary.md \
            --audit-log /tmp/self-review-audit.json

      - name: Append to job summary
        if: always()
        run: |
          cat /tmp/self-review-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f /tmp/self-review-audit.json ]; then
            {
              echo
              echo '<details><summary>Audit record</summary>'
              echo
              echo '```json'
              cat /tmp/self-review-audit.json
              echo
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soundcheck-self-review-audit
          path: /tmp/self-review-audit.json
          if-no-files-found: ignore
