name: Dependabot Auto-merge

on: pull_request

# Least privilege at workflow scope; only the auto-merge job gets what it
# needs.
permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Gate on the PR author, not github.actor, which can be spoofed by
    # re-running someone else's workflow.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      pull-requests: write
      contents: write  # required by gh pr merge --auto to enable auto-merge
    steps:
      # Auto-merge every Dependabot PR regardless of semver tier. --auto only
      # merges once branch protection's required status checks pass. Those
      # contexts are the job names `Run Soundcheck against itself`
      # (self-review.yml) and `Validate skill files` (static-checks.yml), so
      # every update clears the security review and static checks before it
      # lands; a known-CVE version sitting unmerged is the larger risk. A
      # major bump that breaks the build fails those checks and stays open for
      # a human, so no separate tier gate is needed.
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
