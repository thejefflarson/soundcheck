name: Skill Smoke Tests

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Single skill to test (leave blank to run all)"
        required: false
        default: ""
      verbose:
        description: "Print full Claude responses"
        type: boolean
        default: false
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
    # First Monday of Jan/Apr/Jul/Oct at 10:00 UTC — triggers quarterly threat review
    - cron: "0 10 1-7 1,4,7,10 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.108'

      - name: Run smoke tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SKILL:-}" ]; then args+=(--skill "$SKILL"); fi
          if [ "${VERBOSE:-}" = "true" ]; then args+=(--verbose); fi
          python scripts/smoke-test-skills.py "${args[@]}" 2>&1 | tee /tmp/smoke-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Smoke Test Summary"
            echo
            echo "Model: \`claude-haiku-4-5\`"
            echo
            echo '```'
            tail -20 /tmp/smoke-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  quarterly-threat-review:
    name: Open quarterly threat radar review issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only runs on the quarterly schedule (10:00 UTC = distinct from weekly 09:00)
    if: github.event_name == 'schedule' && github.event.schedule == '0 10 1-7 1,4,7,10 1'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.108'

      - name: Draft quarterly threat review
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Script shells out to claude -p with WebSearch/WebFetch/Read and
          # emits the full issue body on stdout. If it fails, fall back to
          # a minimal checklist so the quarterly cadence still fires.
          if python scripts/quarterly-threat-review.py > /tmp/quarterly.md; then
            echo "drafted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drafted=false" >> "$GITHUB_OUTPUT"
            {
              echo "_Automated draft failed — falling back to manual checklist._"
              echo
              echo "- [ ] Review \`docs/threat-radar.md\`"
              echo "- [ ] Check OWASP LLM/API Top 10 for new drafts"
              echo "- [ ] Search NVD for new AI/LLM CVEs since last review"
              echo "- [ ] Review closed \`threat-candidate\` issues"
              echo "- [ ] Verify \`shipped\` skills still reflect current patterns"
            } > /tmp/quarterly.md
          fi

      - name: Open threat radar review issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const now = new Date();
            const quarter = Math.ceil((now.getMonth() + 1) / 3);
            const year = now.getFullYear();
            const title = `Quarterly Threat Radar Review — Q${quarter} ${year}`;

            // Dedupe: list issues with the label and check titles (avoids search API indexing delays)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "threat-radar-review",
              state: "open",
              per_page: 10,
            });
            if (issues.data.some(i => i.title === title)) {
              core.info(`Issue already exists for ${title}`);
              return;
            }

            const body = fs.readFileSync('/tmp/quarterly.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["threat-radar-review"],
            });
