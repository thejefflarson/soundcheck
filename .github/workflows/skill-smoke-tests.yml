name: Skill Smoke Tests

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Single skill to test (leave blank to run all)"
        required: false
        default: ""
      verbose:
        description: "Print full Claude responses"
        type: boolean
        default: false
      benchmark_limit:
        description: "Max SecurityEval samples per skill (leave blank for all)"
        required: false
        default: ""
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
    # First Monday of Jan/Apr/Jul/Oct at 10:00 UTC — triggers quarterly threat review
    - cron: "0 10 1-7 1,4,7,10 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Run smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.108'

      - name: Run smoke tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
          VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SKILL:-}" ]; then args+=(--skill "$SKILL"); fi
          if [ "${VERBOSE:-}" = "true" ]; then args+=(--verbose); fi
          python scripts/smoke-test-skills.py "${args[@]}" 2>&1 | tee /tmp/smoke-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Smoke Test Summary"
            echo
            echo "Model: \`claude-haiku-4-5\`"
            echo
            echo '```'
            tail -20 /tmp/smoke-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  securityeval-benchmark:
    name: SecurityEval benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Run on weekly schedule and manual dispatch; skip the quarterly trigger
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.108'

      - name: Run SecurityEval benchmark
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ github.event.inputs.skill }}
          LIMIT: ${{ github.event.inputs.benchmark_limit }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SKILL:-}" ]; then args+=(--skill "$SKILL"); fi
          if [ -n "${LIMIT:-}" ]; then args+=(--limit "$LIMIT"); fi
          python scripts/benchmark-securityeval.py "${args[@]}" 2>&1 | tee /tmp/benchmark-output.txt
          exit "${PIPESTATUS[0]}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## SecurityEval Benchmark"
            echo
            echo '```'
            tail -20 /tmp/benchmark-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  auto-invocation:
    name: Auto-invocation A/B test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run on weekly schedule and manual dispatch; skip the quarterly trigger
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 9 * * 1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "20"

      - name: Install claude CLI
        run: npm install -g '@anthropic-ai/claude-code@2.1.108'

      - name: Run A/B auto-invocation test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/test-auto-invocation.py --model sonnet 2>&1 | tee /tmp/ab-output.txt

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Auto-Invocation A/B Test"
            echo
            echo "Model: \`sonnet\` — tests whether Soundcheck plugin improves code safety vs bare Claude"
            echo
            echo '```'
            tail -20 /tmp/ab-output.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

